services:
  glpi-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: glpi-mcp:0.1.0
    pull_policy: build
    container_name: glpi-mcp
    restart: unless-stopped

    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      MCP_BEARER_TOKEN: "${MCP_BEARER_TOKEN:?required}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:?required}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-http://127.0.0.1:6274,http://localhost:6274}"
      MARIADB_HOST: "${MARIADB_HOST:?required}"
      MARIADB_PORT: "${MARIADB_PORT:-3306}"
      MARIADB_DATABASE: "${MARIADB_DATABASE:?required}"
      MARIADB_USER: "${MARIADB_USER:?required}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:?required}"
      MARIADB_CONNECT_TIMEOUT: "${MARIADB_CONNECT_TIMEOUT:-10}"
      MARIADB_QUERY_TIMEOUT: "${MARIADB_QUERY_TIMEOUT:-10}"

    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - mcp-gateway-net

networks:
  mcp-gateway-net:
    external: true
